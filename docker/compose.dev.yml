# Local development database. Not for production.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: fluxion
      POSTGRES_PASSWORD: fluxion
      POSTGRES_DB: fluxion
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fluxion-pg:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  fluxion-pg:
